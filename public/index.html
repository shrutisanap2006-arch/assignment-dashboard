<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>Student Assignment Dashboard</h1>

    <section>
      <h2>Create Assignment</h2>
      <form id="assignmentForm">
        <input id="title" placeholder="Assignment title" required />
        <input id="dueDate" type="date" required />
        <button type="submit">Add Assignment</button>
      </form>
    </section>

    <section>
      <h2>Submit Assignment</h2>
      <form id="submissionForm">
        <select id="assignmentId" required>
          <option value="">Choose an assignment</option>
        </select>
        <input id="studentName" placeholder="Student name" required />
        <button type="submit">Submit</button>
      </form>
    </section>

    <section>
      <h2>Assignments</h2>
      <ul id="assignmentList"></ul>
    </section>

    <section>
      <h2>Submissions</h2>
      <ul id="submissionList"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
